<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Laju</title>
  <meta name="description" content="Dashboard kesehatan finansial, tangga milestone, dan rapor keuangan Laju.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="server-status.css">
  <link rel="stylesheet" href="portrait.css">
</head>
<body class="app">
  <header class="topbar">
    <div class="wrap wide app-top">
      <div class="brand-group">
        <button type="button" class="nav-back" id="navBack" aria-label="Kembali ke halaman sebelumnya" title="Kembali" aria-disabled="true">&#8249;</button>
        <a class="brand" href="index.html" aria-label="Laju, beranda">
          <span class="brand-mark" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 7 4-14 3 7h4"/></svg>
          </span>
          Laju
        </a>
        <div id="serverStatus" class="server-status" data-state="checking" role="status" aria-live="polite"></div>
      </div>
      <div class="app-actions">
        <div class="lang-sw" role="group" aria-label="Bahasa"><button type="button" data-lang="id">ID</button><button type="button" data-lang="en">EN</button></div>
        <button type="button" class="ghost-btn icon-only" data-reload aria-label="Reset semua" title="Reset semua dari awal"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
        <button class="ghost-btn" id="demoBtn" type="button">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.9 5.8L4 10.7l5.1 3.6L7.2 21 12 17.3 16.8 21l-1.9-6.7 5.1-3.6-6.1-1.9z"/></svg>
          Data contoh
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap wide" id="view" tabindex="-1"></div>
  </main>

  <nav class="bottomnav" aria-label="Menu utama">
    <a class="navitem" href="#dashboard" data-tab="dashboard"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Beranda</span></a>
    <a class="navitem" href="#milestone" data-tab="milestone"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4v-5h4v-5h4V5h4"/></svg><span>Tangga</span></a>
    <button class="navcatat" id="catatBtn" type="button" aria-haspopup="dialog"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Catat</span></button>
    <a class="navitem" href="#rapor" data-tab="rapor"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/></svg><span>Rapor</span></a>
    <a class="navitem" href="#profil" data-tab="profil"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profil</span></a>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="tip" id="tip" role="tooltip"></div>
  <div class="snack" id="snack" role="status" aria-live="polite"></div>
  <dialog class="sheet" id="confirmDlg" aria-labelledby="cfTitle"></dialog>
  <dialog class="sheet" id="catatDlg" aria-labelledby="catatTitle"></dialog>

  <script src="core.js"></script>
  <script src="i18n-en.js"></script>
  <script src="i18n.js"></script>
  <script src="app-page.js"></script>
  <script src="muat-ulang.js"></script>
  <script type="module">
    import { startServerStatus } from "./server-status.js";
    startServerStatus(document.getElementById("serverStatus"), {
      wsPath: null,   // server Python ini tanpa WebSocket: cukup ping /__health tiap 2 detik
      labels: { live: "LIVE", offline: "OFFLINE", checking: "MENGECEK" },
      titles: {
        live: (ms, time) => `Server berjalan · menjawab dalam ${ms} md · dicek ${time}`,
        offline: (reason, time) => `Server tidak menjawab${reason ? ` (${reason})` : ""} · dicek ${time}`,
      },
    });
  </script>
</body>
</html>
